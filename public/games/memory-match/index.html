<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Memory Match — k399game</title>
  <style>
    :root {
      --bg: #020617;
      --panel: #0f172a;
      --panel-2: #111c33;
      --line: #1e293b;
      --neon: #22c55e;
      --neon-soft: #4ade80;
      --text: #f8fafc;
      --muted: #64748b;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      background: radial-gradient(1200px 600px at 50% -10%, #06281d 0%, var(--bg) 55%);
      color: var(--text);
      font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100%;
      padding: 18px 14px 28px;
      overflow-x: hidden;
    }
    h1 {
      font-size: clamp(1.2rem, 4vw, 1.6rem);
      color: var(--neon);
      letter-spacing: 1px;
      text-shadow: 0 0 18px rgba(34, 197, 94, 0.35);
    }
    .sub { color: var(--muted); font-size: 0.72rem; margin-top: 4px; }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin: 16px 0 12px;
    }
    .seg {
      display: inline-flex;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
    }
    .seg button {
      background: transparent;
      color: var(--muted);
      border: none;
      padding: 8px 14px;
      font: inherit;
      font-size: 0.78rem;
      cursor: pointer;
      transition: all 0.15s;
    }
    .seg button.active {
      background: var(--neon);
      color: #02140b;
      font-weight: 700;
    }
    .btn {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--line);
      padding: 8px 16px;
      border-radius: 10px;
      font: inherit;
      font-size: 0.78rem;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn:hover { border-color: var(--neon); color: var(--neon); }
    .stats {
      display: flex;
      gap: 18px;
      margin-bottom: 14px;
      font-size: 0.78rem;
      color: var(--muted);
    }
    .stats b { color: var(--neon-soft); font-weight: 700; }
    .board {
      display: grid;
      gap: 10px;
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
    }
    .card {
      position: relative;
      aspect-ratio: 1 / 1;
      border: none;
      background: transparent;
      cursor: pointer;
      perspective: 600px;
    }
    .card .inner {
      position: absolute;
      inset: 0;
      transition: transform 0.35s ease;
      transform-style: preserve-3d;
    }
    .card.flipped .inner,
    .card.matched .inner { transform: rotateY(180deg); }
    .face {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      backface-visibility: hidden;
      font-size: clamp(1.4rem, 7vw, 2.4rem);
      user-select: none;
    }
    .front {
      background: linear-gradient(145deg, var(--panel-2), var(--panel));
      border: 1px solid var(--line);
      color: var(--neon);
      box-shadow: inset 0 0 18px rgba(34, 197, 94, 0.08);
    }
    .front::after { content: "?"; font-weight: 700; opacity: 0.5; }
    .back {
      background: linear-gradient(145deg, #0b3a26, #0f172a);
      border: 1px solid rgba(34, 197, 94, 0.35);
      transform: rotateY(180deg);
    }
    .card.matched .back {
      border-color: var(--neon);
      box-shadow: 0 0 16px rgba(34, 197, 94, 0.35);
    }
    .card.matched { animation: pop 0.4s ease; }
    @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.07); } 100% { transform: scale(1); } }
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.82);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 10;
      backdrop-filter: blur(4px);
    }
    .overlay.show { display: flex; animation: fade 0.3s ease; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    .modal {
      background: var(--panel);
      border: 1px solid var(--neon);
      border-radius: 16px;
      padding: 28px 32px;
      text-align: center;
      max-width: 320px;
      box-shadow: 0 0 40px rgba(34, 197, 94, 0.2);
    }
    .modal h2 { color: var(--neon); font-size: 1.3rem; margin-bottom: 8px; }
    .modal p { color: var(--muted); font-size: 0.85rem; line-height: 1.6; margin-bottom: 16px; }
    .modal b { color: var(--neon-soft); }
    .hint { margin-top: 16px; color: var(--muted); font-size: 0.68rem; text-align: center; }
  </style>
</head>
<body>
  <h1>Memory Match</h1>
  <div class="sub">100% AI Generated · 记忆力小游戏 · 翻牌配对，从简单到复杂</div>

  <div class="controls">
    <div class="seg" id="diff">
      <button data-level="easy" class="active">简单</button>
      <button data-level="medium">中等</button>
      <button data-level="hard">困难</button>
    </div>
    <button class="btn" id="restart">重新开始</button>
  </div>

  <div class="stats">
    <span>时间 <b id="time">0:00</b></span>
    <span>步数 <b id="moves">0</b></span>
    <span>最佳 <b id="best">—</b></span>
  </div>

  <div class="board" id="board"></div>

  <div class="hint">点击卡片翻面，找出所有配对。连续配对越快，最佳成绩越好。</div>

  <div class="overlay" id="overlay">
    <div class="modal">
      <h2 id="winTitle">全部配对！</h2>
      <p id="winText"></p>
      <button class="btn" id="playAgain">再玩一次</button>
    </div>
  </div>

  <script>
    const POOL = ["🍎","🍌","🍇","🍓","🍑","🍒","🥝","🍉","🍊","🍋","🥥","🍍","🌶️","🥕","🌽","🍄","🌰","🥦","🍆","🥑","🍐","🫐","🍈","🥭"];
    const LEVELS = { easy: 6, medium: 8, hard: 12 };

    const boardEl = document.getElementById("board");
    const timeEl = document.getElementById("time");
    const movesEl = document.getElementById("moves");
    const bestEl = document.getElementById("best");
    const overlay = document.getElementById("overlay");

    let level = "easy";
    let deck = [];
    let first = null;
    let lock = false;
    let moves = 0;
    let matched = 0;
    let startedAt = 0;
    let timer = null;

    function shuffle(a) {
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function fmt(s) {
      const m = Math.floor(s / 60);
      const r = s % 60;
      return m + ":" + String(r).padStart(2, "0");
    }

    function bestKey() { return "k399-memory-best-" + level; }

    function showBest() {
      const v = localStorage.getItem(bestKey());
      bestEl.textContent = v ? fmt(v) : "—";
    }

    function startTimer() {
      startedAt = Date.now();
      clearInterval(timer);
      timer = setInterval(() => {
        timeEl.textContent = fmt(Math.floor((Date.now() - startedAt) / 1000));
      }, 250);
    }

    function stopTimer() { clearInterval(timer); }

    function buildDeck() {
      const n = LEVELS[level];
      const picks = shuffle(POOL.slice()).slice(0, n);
      deck = shuffle([...picks, ...picks]);
    }

    function render() {
      const n = LEVELS[level];
      const cols = n <= 6 ? 4 : (n <= 8 ? 4 : 6);
      boardEl.style.gridTemplateColumns = "repeat(" + cols + ", 1fr)";
      boardEl.innerHTML = "";
      deck.forEach((sym, i) => {
        const card = document.createElement("button");
        card.className = "card";
        card.dataset.i = i;
        card.innerHTML =
          '<div class="inner">' +
            '<div class="face front"></div>' +
            '<div class="face back">' + sym + '</div>' +
          '</div>';
        card.addEventListener("click", () => flip(card, i));
        boardEl.appendChild(card);
      });
    }

    function flip(card, i) {
      if (lock) return;
      if (card.classList.contains("flipped") || card.classList.contains("matched")) return;
      if (first && first.i === i) return;

      if (!startedAt) startTimer();
      card.classList.add("flipped");

      if (!first) {
        first = { card, i };
        return;
      }

      moves++;
      movesEl.textContent = moves;
      const a = first, b = { card, i };
      first = null;

      if (deck[a.i] === deck[b.i]) {
        a.card.classList.add("matched");
        b.card.classList.add("matched");
        matched += 2;
        if (matched === deck.length) win();
      } else {
        lock = true;
        setTimeout(() => {
          a.card.classList.remove("flipped");
          b.card.classList.remove("flipped");
          lock = false;
        }, 750);
      }
    }

    function win() {
      stopTimer();
      const secs = Math.floor((Date.now() - startedAt) / 1000);
      timeEl.textContent = fmt(secs);
      const prev = localStorage.getItem(bestKey());
      let isBest = false;
      if (!prev || secs < Number(prev)) {
        localStorage.setItem(bestKey(), String(secs));
        isBest = true;
      }
      showBest();
      document.getElementById("winText").innerHTML =
        "用时 <b>" + fmt(secs) + "</b> · 步数 <b>" + moves + "</b>" +
        (isBest ? "<br>新纪录！🎉" : "");
      overlay.classList.add("show");
    }

    function newGame() {
      stopTimer();
      first = null;
      lock = false;
      moves = 0;
      matched = 0;
      startedAt = 0;
      timeEl.textContent = "0:00";
      movesEl.textContent = "0";
      overlay.classList.remove("show");
      buildDeck();
      render();
      showBest();
    }

    document.getElementById("diff").addEventListener("click", (e) => {
      const btn = e.target.closest("button");
      if (!btn) return;
      level = btn.dataset.level;
      document.querySelectorAll("#diff button").forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      newGame();
    });

    document.getElementById("restart").addEventListener("click", newGame);
    document.getElementById("playAgain").addEventListener("click", newGame);

    newGame();
  </script>
</body>
</html>
